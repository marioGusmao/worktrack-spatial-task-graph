name: Node.js checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release artifact syntax
        run: node --check main.js
      - name: Reject runtime dynamic imports of Obsidian
        run: node -e "const fs=require('fs');const s=fs.readFileSync('main.js','utf8');if(s.includes('import(\\\"obsidian\\\")')){throw new Error('Bundled plugin contains a runtime dynamic import of Obsidian')}"
